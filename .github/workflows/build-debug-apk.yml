name: Build Debug APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/build-debug-apk.yml'
  workflow_dispatch:

jobs:
  build_debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit short SHA & Date
        id: vars
        run: |
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          echo "YY_MM=$(date +'%y.%m')" >> $GITHUB_OUTPUT

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename Debug APK
        id: rename_apk
        run: |
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$SRC" ] || { echo "APK not found"; exit 1; }
          VERSION_TAG="${{ steps.vars.outputs.YY_MM }}.${{ steps.vars.outputs.SHORT_SHA }}"
          DEST="app-debug-${VERSION_TAG}.apk"
          cp "$SRC" "$DEST"
          echo "apk=${DEST}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT

      - name: Delete old debug preview release
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 0
          delete_tags: true
          delete_tag_pattern: "^debug-"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Debug Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Debug Build (${{ steps.vars.outputs.SHORT_SHA }})"
          tag_name: "debug-${{ steps.rename_apk.outputs.version_tag }}"
          target_commitish: ${{ github.sha }}
          body: |
            ## Debug 签名自动构建（可直接安装）

            - 提交: ${{ github.sha }}
            - 使用 debug keystore 签名，无需配置 secrets

            **安装提示**: 若设备上已装有不同签名的 nap511，需先卸载后再安装本 APK。
          prerelease: true
          files: ${{ steps.rename_apk.outputs.apk }}
