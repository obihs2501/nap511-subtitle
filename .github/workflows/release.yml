name: Release APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  build_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          build-scan-publish: false

      - name: Prepare version
        id: version
        shell: bash
        run: |
          chmod +x ./gradlew
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          SHA=$(git rev-parse --short=7 HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"
          echo "apk=nap511-${VERSION}-release-${SHA}.apk" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = os.environ.get('SIGNING_KEY', '')
          if not key:
              raise SystemExit('ANDROID_SIGNING_KEY is not configured; refusing an unsigned release.')
          path = Path(os.environ['RUNNER_TEMP']) / 'nap511-release.jks'
          path.write_bytes(base64.b64decode(key, validate=True))
          path.chmod(0o600)
          PY

      # 使用 AGP 默认提供的 JVM 单测变体，不打包 Debug APK；最终仅 assembleRelease。
      - name: Test and build signed Release APK
        env:
          NAP511_SIGNING_STORE_FILE: ${{ runner.temp }}/nap511-release.jks
          NAP511_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NAP511_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NAP511_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify Release signature and package
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/nap511-release-badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/nap511-release-badging.txt"; then
            echo 'Refusing to publish a debuggable APK'
            exit 1
          fi
          cp "$APK" '${{ steps.version.outputs.apk }}'

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "nap511 ${{ steps.version.outputs.version }} Release (${{ steps.version.outputs.sha }})"
          prerelease: false
          make_latest: 'true'
          files: ${{ steps.version.outputs.apk }}
          body: |
            ## Release APK（非 Debug，固定签名）
            - 合并上游 d329818：设置数据层、强类型菜单、高清瀑布流、大屏与离线任务改进。
            - 修复长按临时倍速的手势分发，松手 / 取消恢复原速；底部新增固定播放暂停键，删除顶部重复字幕入口。
            - 内置本机下载：无需 aria2 配置，支持后台传输、进度、取消和获取新链接重试，保存到 Download/nap511。
            - 保留在线字幕关键词搜索、ASS 修复、选集 / 连播、锁屏、定时暂停与字幕样式同步。
            - 提交：${{ github.sha }}

            初次从不同签名的 Debug / 上游版本切换时，可能需要卸载旧版；后续本仓库 Release 使用同一签名。

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'nap511-release.jks').unlink(missing_ok=True)
          PY
